name: TreMana 0.2.0 test release

on:
  push:
    branches:
      - release/v0.2.0

permissions:
  contents: write

concurrency:
  group: tremana-preview-v0.2.0
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Require isolated preview ref and exact version metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release/v0.2.0" ]] || exit 1
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Config/Info.plist)"
          [[ "$version" == "0.2.0" ]] || exit 1
          preview="$(/usr/libexec/PlistBuddy -c 'Print :TreManaTestVersion' Config/Info.plist)"
          [[ "$preview" == "0.2.0" ]] || exit 1
          test -s docs/releases/v0.2.0.md
          echo 'RELEASE_TAG=v0.2.0' >> "$GITHUB_ENV"
          echo 'RELEASE_VERSION=0.2.0' >> "$GITHUB_ENV"

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_27.2.app ]]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          elif [[ -d /Applications/Xcode_27.1.app ]]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          else
            echo "Xcode 27 is unavailable" >&2
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Compile and test exact preview commit
        shell: bash
        run: |
          set -euo pipefail
          swift package dump-package > /dev/null
          python3 scripts/validate-localizations.py
          swift test --parallel

      - name: Package and verify exact preview build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-app.sh
          app=dist/TreMana.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'com.sl.tremana'
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist" | grep -Fx '27.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" | grep -Fx '0.2.0'
          /usr/libexec/PlistBuddy -c 'Print :TreManaTestVersion' "$app/Contents/Info.plist" | grep -Fx "$RELEASE_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist" | grep -Fx '2'
          codesign --verify --strict "$app"
          for locale in en ru; do
            test -s "$app/Contents/Resources/$locale.lproj/Localizable.strings"
            plutil -lint "$app/Contents/Resources/$locale.lproj/Localizable.strings"
          done
          archs="$(lipo -archs "$app/Contents/MacOS/TreMana")"
          [[ "$archs" == "arm64" ]] || {
            echo "Expected arm64, got $archs" >&2
            exit 1
          }
          asset="TreMana-v$RELEASE_VERSION-macOS27-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$asset"
          (
            cd dist
            shasum -a 256 "$asset" > "$asset.sha256"
          )
          echo "ASSET_PATH=dist/$asset" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=dist/$asset.sha256" >> "$GITHUB_ENV"

      - name: Publish immutable test prerelease at exact checked SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Existing prerelease must never be overwritten" >&2
            exit 1
          fi
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .object.sha")"
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to move existing tag" >&2
            exit 1
          fi
          if [[ -z "$tag_sha" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          gh release create "$RELEASE_TAG" "$ASSET_PATH" "$CHECKSUM_PATH" \
            --verify-tag --prerelease \
            --title "TreMana $RELEASE_VERSION (test build)" \
            --notes-file "docs/releases/$RELEASE_TAG.md"

      - name: Verify uploaded archive and prerelease metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,assets \
            --jq 'if (.isDraft == false and .isPrerelease == true and .tagName == "v0.2.0" and (.assets | length) == 2) then "PREVIEW VERIFIED" else error("Invalid release metadata") end'
          mkdir -p "$RUNNER_TEMP/tremana-preview-verify"
          gh release download "$RELEASE_TAG" \
            --pattern "$(basename "$ASSET_PATH")" \
            --dir "$RUNNER_TEMP/tremana-preview-verify"
          cmp "$ASSET_PATH" "$RUNNER_TEMP/tremana-preview-verify/$(basename "$ASSET_PATH")"
          printf 'Direct test ZIP: https://github.com/%s/releases/download/%s/%s\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$(basename "$ASSET_PATH")" >> "$GITHUB_STEP_SUMMARY"
