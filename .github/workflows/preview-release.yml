name: TreMana numeric release

on:
  push:
    branches:
      - 'release/v*'
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: tremana-preview-${{ github.ref_name }}
  # A newer push to a numeric release branch supersedes unfinished builds.
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.actor == 'StanleyLl0yd' && github.triggering_actor == 'StanleyLl0yd'
    environment: tremana-signing
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Require isolated preview ref and exact version metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only numeric release branches can publish" >&2
            exit 1
          }
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Config/Info.plist)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$GITHUB_REF" == "refs/heads/release/v$version" ]] || exit 1
          [[ "$(tr -d '[:space:]' < release/VERSION)" == "$version" ]] || exit 1
          test -s "docs/releases/v$version.md"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_27.2.app ]]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          elif [[ -d /Applications/Xcode_27.1.app ]]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          else
            echo "Xcode 27 is unavailable" >&2
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Validate signing bootstrap syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup-signing.sh
          bash -n scripts/import-signing-identity.sh
          bash -n scripts/verify-signing-identity.sh
          bash -n scripts/package-app.sh

      - name: Compile and test exact preview commit
        shell: bash
        run: |
          set -euo pipefail
          swift package dump-package > /dev/null
          python3 scripts/validate-localizations.py
          python3 scripts/validate-swiftui-model-injection.py
          swift test --parallel

      - name: Import pinned TreMana signing identity
        shell: bash
        env:
          TREMANA_CERT_P12_BASE64: ${{ secrets.TREMANA_CERT_P12_BASE64 }}
          TREMANA_CERT_PASSWORD: ${{ secrets.TREMANA_CERT_PASSWORD }}
          TREMANA_CERT_SHA256: ${{ vars.TREMANA_CERT_SHA256 }}
        run: bash scripts/import-signing-identity.sh

      - name: Package and verify exact preview build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-app.sh
          app=dist/TreMana.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'com.sl.tremana'
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist" | grep -Fx '27.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" | grep -Fx "$RELEASE_VERSION"
          bundle_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          [[ "$bundle_build" =~ ^[1-9][0-9]*$ ]] || exit 1
          codesign --verify --strict "$app"
          for locale in en ru; do
            test -s "$app/Contents/Resources/$locale.lproj/Localizable.strings"
            plutil -lint "$app/Contents/Resources/$locale.lproj/Localizable.strings"
          done
          archs="$(lipo -archs "$app/Contents/MacOS/TreMana")"
          [[ "$archs" == "arm64" ]] || {
            echo "Expected arm64, got $archs" >&2
            exit 1
          }
          asset="TreMana-v$RELEASE_VERSION-macOS27-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$asset"
          (
            cd dist
            shasum -a 256 "$asset" > "$asset.sha256"
          )
          echo "ASSET_PATH=dist/$asset" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=dist/$asset.sha256" >> "$GITHUB_ENV"

      - name: Verify stable Code Signing requirement
        shell: bash
        run: bash scripts/verify-signing-identity.sh

      - name: Require checked commit is still the release branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          [[ "$current" == "$GITHUB_SHA" ]] || {
            echo "Another commit superseded this tested build. Refusing stale release." >&2
            exit 1
          }

      - name: Publish immutable release at exact checked SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Existing release must never be overwritten" >&2
            exit 1
          fi
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .object.sha")"
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing to move existing tag" >&2
            exit 1
          fi
          if [[ -z "$tag_sha" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          gh release create "$RELEASE_TAG" "$ASSET_PATH" "$CHECKSUM_PATH" \
            --verify-tag --latest --target "$GITHUB_SHA" \
            --title "TreMana $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_TAG.md"

      - name: Verify uploaded archive and full release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,assets \
            --jq 'if (.isDraft == false and .isPrerelease == false and (.assets | length) == 2) then "RELEASE VERIFIED" else error("Invalid release metadata") end'
          mkdir -p "$RUNNER_TEMP/tremana-preview-verify"
          gh release download "$RELEASE_TAG" \
            --pattern "$(basename "$ASSET_PATH")" \
            --dir "$RUNNER_TEMP/tremana-preview-verify"
          cmp "$ASSET_PATH" "$RUNNER_TEMP/tremana-preview-verify/$(basename "$ASSET_PATH")"
          printf 'Direct ZIP: https://github.com/%s/releases/download/%s/%s\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$(basename "$ASSET_PATH")" >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy ephemeral signing identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TREMANA_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$TREMANA_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${TREMANA_SIGNING_P12:-}" ]]; then
            rm -f "$TREMANA_SIGNING_P12"
          fi
          if [[ -n "${TREMANA_SIGNING_CERT:-}" ]]; then
            rm -f "$TREMANA_SIGNING_CERT"
          fi
          rm -f "$RUNNER_TEMP/tremana-certificate.txt" "$RUNNER_TEMP/tremana-identities.txt"

