name: Normalize TreMana published releases

on:
  push:
    branches:
      - fix/release-metadata-policy
    paths:
      - .github/workflows/reconcile-release-metadata.yml

permissions:
  contents: write

concurrency:
  group: tremana-releases-metadata-migration
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'StanleyLl0yd/tremana' && github.actor == 'StanleyLl0yd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Convert published version releases without changing tags or assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          releases=(
            v0.2.0-beta.1 v0.2.0 v0.2.1 v0.3.0
            v0.4.0 v0.4.1 v0.4.2 v0.4.3 v0.4.4 v0.4.5
          )

          for tag in "${releases[@]}"; do
            metadata="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            id="$(jq -r '.id' <<< "$metadata")"
            found_tag="$(jq -r '.tag_name' <<< "$metadata")"
            draft="$(jq -r '.draft' <<< "$metadata")"
            asset_count="$(jq -r '.assets | length' <<< "$metadata")"
            [[ "$found_tag" == "$tag" && "$draft" == false && "$asset_count" == 2 ]] || {
              echo "Unexpected release metadata for $tag; refusing to alter" >&2
              exit 1
            }

            title="TreMana ${tag#v}"
            if [[ "$tag" == v0.4.5 ]]; then
              latest=false
              latest_flag=true
            else
              latest_flag=false
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F prerelease=false \
              -f "name=$title" \
              -f "make_latest=$latest_flag" \
              --jq '{tag: .tag_name, name: .name, prerelease: .prerelease, draft: .draft, assets: (.assets | length)}'

            refreshed="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            jq -e --arg tag "$tag" --arg name "$title" \
              '.tag_name == $tag and .name == $name and .prerelease == false and .draft == false and (.assets | length) == 2' \
              <<< "$refreshed" > /dev/null
          done

          current_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          [[ "$current_latest" == v0.4.5 ]] || {
            echo "Latest GitHub Release is $current_latest, expected v0.4.5" >&2
            exit 1
          }
          echo "10 historical releases converted to full releases. Latest: $current_latest" >> "$GITHUB_STEP_SUMMARY"
